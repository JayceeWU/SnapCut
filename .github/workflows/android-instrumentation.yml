name: Android instrumentation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/android-instrumentation.yml
      - package-lock.json
      - modules/snap-cut-media/android/src/main/**
      - modules/snap-cut-media/android/src/androidTest/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: API ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install
        env:
          NODE_ENV: production

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Run module instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: adb wait-for-device && sh -c 'attempt=0; until adb shell service check package 2>/dev/null | grep -q "found"; do attempt=$((attempt + 1)); if [ "$attempt" -ge 60 ]; then exit 1; fi; sleep 2; done' && ./android/gradlew -p android :snap-cut-media:connectedDebugAndroidTest --stacktrace --no-daemon
